<!DOCTYPE html>
<html lang="zh-TW">
<head>
<meta charset="UTF-8">
<meta name="viewport" content="width=device-width, initial-scale=1.0">
<title>直玩有獎問答</title>
<style>
  * { box-sizing: border-box; margin: 0; padding: 0; }
  /* 2026-10-19 改為手機寬度排版（doGet addMetaTag viewport）＋ rem：
     原本以桌機寬度約 980px 排版再縮小，原 px 數值 ÷ 24 換成 rem；整體放大縮小只改這裡的 17px */
  html { font-size: 17px; -webkit-text-size-adjust: 100%; text-size-adjust: 100%; }
  body { font-family: sans-serif; background: #f5f5f5; padding: 1rem; }

  .header { background: #4a90d9; color: #fff; padding: 0.833rem 1rem; border-radius: 0.417rem; margin-bottom: 0.833rem; }
  .brand-row { position: relative; text-align: center; }
  .brand-tag { position: absolute; left: 0; top: 50%; transform: translateY(-50%); font-size: 0.85rem; opacity: 0.85; }
  .brand-name { font-size: 1.667rem; font-weight: bold; }
  .header p { font-size: 0.917rem; opacity: 0.85; margin-top: 0.25rem; text-align: center; }

  .card { background: #fff; border-radius: 0.417rem; padding: 1rem; margin-bottom: 0.833rem; box-shadow: 0 1px 0.167rem rgba(0,0,0,0.1); }

  .quiz-deadline { font-size: 0.917rem; color: #4a90d9; text-align: center; margin-bottom: 0.333rem; }
  .progress { font-size: 1rem; color: #888; margin-bottom: 0.417rem; display: flex; justify-content: space-between; }
  .diff-mark { color: #ccc; }

  .timer-track { height: 0.417rem; border-radius: 0.25rem; background: #eee; overflow: hidden; margin-bottom: 0.75rem; }
  .timer-fill { height: 100%; width: 100%; background: #27ae60; animation: timerShrink 15s linear forwards; }
  @keyframes timerShrink {
    0%   { width: 100%; background: #27ae60; }
    60%  { background: #e67e22; }
    85%  { background: #c0392b; }
    100% { width: 0%; background: #c0392b; }
  }

  .question-text { font-size: 1.25rem; line-height: 1.5; margin-bottom: 0.833rem; }

  .option-btn {
    display: block; width: 100%; text-align: left; padding: 0.75rem 0.833rem; margin-bottom: 0.583rem;
    border: 2px solid #ddd; border-radius: 0.417rem; background: #fff; color: #222;
    font-size: 1.125rem; font-family: inherit; cursor: pointer; line-height: 1.4;
  }
  .option-btn:last-child { margin-bottom: 0; }
  .option-btn:disabled { cursor: not-allowed; }
  .option-btn.correct { background: #d4efdf; border-color: #1e8449; color: #1e8449; font-weight: bold; }
  .option-btn.wrong { background: #fde8e8; border-color: #c0392b; color: #c0392b; font-weight: bold; }

  .feedback { padding: 0.75rem 0.917rem; border-radius: 0.417rem; font-size: 1.167rem; margin-bottom: 0.833rem; line-height: 1.5; }
  .feedback-ok  { background: #d4efdf; color: #1e8449; }
  .feedback-bad { background: #fde8e8; color: #c0392b; }
  .feedback-timeout { background: #fff3cd; color: #856404; }

  .chat-prompt { font-size: 1.167rem; margin-bottom: 0.833rem; text-align: center; }
  .chat-actions { display: flex; gap: 0.583rem; }
  .btn { padding: 0.75rem; border: none; border-radius: 0.417rem; font-size: 1.167rem; color: #fff; cursor: pointer; font-family: inherit; }
  .btn:disabled { opacity: 0.6; cursor: not-allowed; }
  .btn-skip { background: #999; flex: 1; }
  .btn-chat { background: #8e44ad; flex: 1; }
  .btn-next { background: #4a90d9; width: 100%; margin-top: 0.833rem; }

  .chat-log { margin-top: 0.167rem; margin-bottom: 0.5rem; }
  .chat-bubble { padding: 0.5rem 0.667rem; border-radius: 0.583rem; margin-bottom: 0.417rem; font-size: 1rem; line-height: 1.4; max-width: 85%; white-space: pre-wrap; }
  .chat-bubble.user { background: #4a90d9; color: #fff; margin-left: auto; border-bottom-right-radius: 0.167rem; }
  .chat-bubble.model { background: #f0eefc; color: #5b2c8e; margin-right: auto; border-bottom-left-radius: 0.167rem; }
  .chat-bubble.typing { display: flex; width: fit-content; align-items: center; gap: 0.25rem; }
  .chat-bubble.typing .typing-label { font-size: 0.917rem; opacity: 0.8; margin-right: 0.167rem; }
  .chat-bubble.typing .dot { width: 0.375rem; height: 0.375rem; border-radius: 50%; background: #8e44ad; animation: typingDot 1.2s infinite ease-in-out; }
  .chat-bubble.typing .dot:nth-child(3) { animation-delay: 0.2s; }
  .chat-bubble.typing .dot:nth-child(4) { animation-delay: 0.4s; }
  @keyframes typingDot { 0%, 60%, 100% { opacity: 0.25; transform: translateY(0); } 30% { opacity: 1; transform: translateY(-0.208rem); } }
  .chat-input-row { display: flex; gap: 0.417rem; }
  .chat-input-row input {
    flex: 1; min-width: 0; padding: 0.583rem; border: 1px solid #ddd; border-radius: 0.417rem;
    font-size: 1rem; font-family: inherit;
  }
  .btn-send { background: #8e44ad; color: #fff; padding: 0.583rem 0.833rem; border: none; border-radius: 0.417rem; font-size: 1rem; cursor: pointer; font-family: inherit; white-space: nowrap; }
  .btn-send:disabled, .chat-input-row input:disabled { opacity: 0.5; cursor: not-allowed; }

  .summary-total { text-align: center; padding: 0.417rem 0 0.833rem; }
  .summary-total .num { font-size: 2.333rem; font-weight: bold; color: #1e8449; }
  .summary-total .label { font-size: 1rem; color: #888; }

  .final-msg { font-size: 1.167rem; line-height: 1.6; text-align: center; }

  #screen-quiz, #screen-summary, #screen-cert { display: none; }

  .intro-text { font-size: 1.5rem; line-height: 1.6; text-align: center; margin-bottom: 0.5rem; }
  .intro-rule { font-size: 1.083rem; line-height: 1.6; text-align: center; color: #666; }

  /* ===== 得獎憑證 ===== */
  .cert-note { font-size: 1rem; color: #888; text-align: center; margin-bottom: 0.667rem; }
  .cert-title { font-size: 1.5rem; font-weight: bold; text-align: center; color: #b9770e; margin-bottom: 0.75rem; }
  .cert-ticket {
    border: 0.125rem dashed #e0a526; border-radius: 0.583rem; background: #fffaf0;
    padding: 0.917rem 0.75rem; text-align: center; margin-bottom: 0.833rem;
  }
  .cert-label { font-size: 0.917rem; color: #999; }
  .cert-no { font-size: 1.2rem; font-weight: bold; color: #222; margin: 0.167rem 0 0.667rem; white-space: nowrap; }
  .cert-amount { font-size: 2.5rem; font-weight: bold; color: #1e8449; line-height: 1.2; }
  .cert-coins { font-size: 2.2rem; line-height: 1.3; margin-top: 0.25rem; letter-spacing: 0.25rem; }
  .cert-meta { font-size: 0.917rem; color: #666; margin-top: 0.5rem; line-height: 1.6; }
  .cert-alert {
    display: flex; align-items: center; gap: 0.5rem;
    background: #c0392b; color: #fff; border-radius: 0.417rem; padding: 0.5rem 0.5rem 0.5rem 0.75rem; margin-bottom: 0.75rem;
    font-size: 1.167rem; font-weight: bold; animation: alertPulse 1.6s ease-in-out infinite;
  }
  .cert-alert span { flex: 1; line-height: 1.4; }
  @keyframes alertPulse { 0%, 100% { transform: scale(1); } 50% { transform: scale(1.03); } }
  .portal-btn {
    flex: none; padding: 0.583rem 0.75rem; border-radius: 0.417rem; white-space: nowrap;
    background: #fff; color: #0084ff; font-size: 1.167rem; font-weight: bold; text-decoration: none;
  }

  /* ===== 遊戲橫幅（來自 橫幅.html） ===== */
  .game-banner-card {
    position: relative; width: 100%; height: 4rem; border-radius: 0.667rem; overflow: hidden;
    background: linear-gradient(180deg, #7ad5fb 0%, #b8ebff 65%, #62c370 65%, #48a655 100%);
    box-shadow: 0 0.167rem 0.583rem rgba(0, 80, 160, 0.12); border: 2px solid #ffffff;
    margin-bottom: 0.833rem; user-select: none;
  }
  .music-btn {
    position: absolute; top: 0.333rem; right: 0.333rem; z-index: 10; width: 2.2rem; height: 2.2rem;
    border-radius: 50%; background: rgba(255, 255, 255, 0.9); border: 1px solid rgba(0, 0, 0, 0.1);
    box-shadow: 0 2px 0.208rem rgba(0, 0, 0, 0.15); cursor: pointer;
    display: flex; align-items: center; justify-content: center; font-size: 0.625rem; padding: 0; outline: none;
  }
  .sky-clouds {
    position: absolute; top: 0.333rem; left: 0; width: 200%; height: 1.5rem;
    background-image: radial-gradient(circle 0.5rem at 0.833rem 0.75rem, #ffffff 100%, transparent 0),
                      radial-gradient(circle 0.667rem at 1.5rem 0.583rem, #ffffff 100%, transparent 0),
                      radial-gradient(circle 0.5rem at 2.167rem 0.75rem, #ffffff 100%, transparent 0),
                      radial-gradient(circle 0.417rem at 5.833rem 0.667rem, #ffffff 100%, transparent 0);
    background-size: 8.333rem 1.5rem; background-repeat: repeat-x; opacity: 0.85;
    animation: cloudDrift 20s linear infinite;
  }
  .ground-track {
    position: absolute; bottom: 0; left: 0; width: 200%; height: 1.333rem;
    background-image: repeating-linear-gradient(90deg, transparent, transparent 1.458rem,
      rgba(255, 255, 255, 0.25) 1.458rem, rgba(255, 255, 255, 0.25) 1.875rem);
    animation: groundRun 2.5s linear infinite;
  }
  .banner-character-box {
    position: absolute; bottom: 0.417rem; left: 15%; width: 2rem; height: 2rem;
    transition: left 0.8s cubic-bezier(0.34, 1.56, 0.64, 1); z-index: 2;
  }
  .banner-character {
    width: 100%; height: 100%; display: flex; align-items: center; justify-content: center;
    font-size: 1.417rem; animation: charWaddle 0.5s ease-in-out infinite alternate; transform-origin: bottom center;
  }
  @keyframes charWaddle { 0% { transform: translateY(0) rotate(-4deg); } 100% { transform: translateY(-0.208rem) rotate(4deg); } }
  @keyframes cloudDrift { 0% { transform: translateX(0); } 100% { transform: translateX(-50%); } }
  @keyframes groundRun { 0% { transform: translateX(0); } 100% { transform: translateX(-50%); } }
  .char-jump { animation: victoryJump 0.4s ease-in-out 3 !important; }
  @keyframes victoryJump { 0% { transform: scale(1) translateY(0); } 50% { transform: scale(1.2) translateY(-1.583rem); } 100% { transform: scale(1) translateY(0); } }
  .char-shake { animation: hurtShake 0.4s ease-in-out 3 !important; }
  @keyframes hurtShake { 0%, 100% { transform: translateX(0) rotate(0deg); } 25% { transform: translateX(-0.333rem) rotate(-14deg); } 75% { transform: translateX(0.333rem) rotate(14deg); } }
</style>
<script>
  // 保險（同帳務模組）：doGet 已用 addMetaTag('viewport') 讓手機以裝置寬度排版；若瀏覽器仍用桌機寬度排版
  // （Chrome 勾「電腦版網站」、部分 App 內建瀏覽器），按比例放大 html 字級，rem 全部跟著放大。不可刪
  (function () {
    try {
      const landscape = window.matchMedia && window.matchMedia('(orientation: landscape)').matches;
      const device = landscape ? Math.max(screen.width, screen.height) : Math.min(screen.width, screen.height);
      const ratio = window.innerWidth / device;
      if (device < 700 && ratio > 1.3) {
        document.documentElement.style.fontSize = (17 * ratio) + 'px';
      }
    } catch (e) { /* 判斷失敗就維持 17px */ }
  })();
</script>
</head>
<body>

<div class="header">
  <div class="brand-row">
    <span class="brand-tag">有獎問答</span>
    <span class="brand-name">天生一對</span>
  </div>
  <p>本期截止 <span class="deadline-text"></span></p>
</div>

<div class="game-banner-card" id="gameBanner">
  <button class="music-btn" id="musicBtn" onclick="toggleAudio()" title="開關聲音">🔈</button>
  <div class="sky-clouds"></div>
  <div class="ground-track"></div>
  <div class="banner-character-box" id="charBox">
    <div class="banner-character" id="charSprite">🦁</div>
  </div>
</div>

<div id="screen-loading" class="card"><div class="final-msg">載入中…</div></div>

<div id="screen-intro" class="card" style="display:none;">
  <div class="intro-text" id="intro-text">準備好了嗎？答對有獎金喔！</div>
  <div class="intro-rule" id="intro-rule"></div>
  <button class="btn btn-next" id="intro-btn" onclick="beginQuiz()">開始問答</button>
</div>

<div id="screen-quiz" class="card">
  <div class="quiz-deadline">本期截止 <span class="deadline-text"></span></div>
  <div class="progress"><span id="progress"></span><span class="diff-mark" id="diff-mark"></span></div>
  <div class="timer-track"><div class="timer-fill" id="timer-fill"></div></div>
  <div class="question-text" id="question-text"></div>
  <div id="options"></div>
  <div id="feedback-area"></div>
</div>

<div id="screen-summary" class="card">
  <div class="summary-total">
    <div class="num" id="summary-num">0</div>
    <div class="label">本輪獲得（元）</div>
  </div>
  <div id="summary-body"></div>
</div>

<div id="screen-cert" class="card"></div>

<script>
  // ===== GitHub Pages 版（2026-10-25）=====
  // 這份是正式前端；GAS 專案裡的 index.html 只當備援，之後改畫面只改這份
  // 進入資料改由 GAS 的 doPost（入口_API.js）init 取得，不再用 GAS 模板語法
  const GAS_API_URL = 'https://script.google.com/macros/s/AKfycbyUOnqGcBTbSmoemKt7eaathaop6Ab_Jj-WfFoVnP_McOxKW_Vy4VB9TcUyf3dbHkcXNA/exec';
  let ACTIVITY = '';
  let STATUS = '';  // open／closed（已截止）／full（已額滿）
  let CONFIG = {};
  let FRESH_QUESTIONS = [];
  // 維護測試碼（網址 ?test=）：系統維護中帶正確測試碼才放行；每次呼叫 API 都帶上
  const TEST_CODE = new URLSearchParams(location.search).get('test') || '';
  const STORE_KEY = 'zhiwanQuiz';
  let SECONDS = 15;
  let PRIZE = 10;

  // 呼叫 GAS API：Content-Type 用 text/plain，避開 CORS 預檢；回傳 data，失敗丟錯
  async function callGasApi(action, payload) {
    const res = await fetch(GAS_API_URL, {
      method: 'POST',
      headers: { 'Content-Type': 'text/plain;charset=utf-8' },
      body: JSON.stringify({ action: action, payload: payload || {} })
    });
    const json = await res.json();
    if (!json.ok) throw new Error(json.error);
    return json.data;
  }

  // 取代 google.script.run 的同款寫法：gasRun().withSuccessHandler(f).withFailureHandler(g).函式名(參數…)
  // 讓原本的成功／失敗處理程式不必改動
  function gasRun() {
    let onOk = function () {}, onFail = function () {};
    const call = function (action, payload) {
      callGasApi(action, payload).then(function (d) { onOk(d); }, function (e) { onFail(e); });
    };
    const runner = {
      withSuccessHandler: function (f) { onOk = f; return runner; },
      withFailureHandler: function (f) { onFail = f; return runner; },
      chatReply: function (seed, questionText, feedbackText, history, userMessage, testCode) {
        call('chatReply', { seed: seed, questionText: questionText, feedbackText: feedbackText, history: history, userMessage: userMessage, testCode: testCode });
      },
      issueCertificate: function (activityCode, answers, testCode) {
        call('issueCertificate', { activityCode: activityCode, answers: answers, testCode: testCode });
      }
    };
    return runner;
  }

  // 本輪狀態，同期限制開啟時存進 localStorage，刷新／斷線重連可接續
  // { activity, questions:[{question,options,answer,seed,difficulty}], results:[null|{chosen,correct,timeout}], shown, cert }
  // shown = 已顯示但還沒作答的題號（-1 表示沒有），用來防「看到難題就刷新」
  let state = null;
  let qIndex = 0;

  // 閒聊狀態：每題重新開始聊天時重置
  let chatHistory = []; // [{role:'user'|'model', text:'...'}] 真實對話輪次，不含題目/回饋這兩則模板文字
  let chatRound = 0; // 已完成的真實LLM回合數，滿3輪後前端攔截不再呼叫API
  let currentQuestionText = '';
  let currentFeedbackText = '';

  let questionTimer = null;

  function escapeHtml(s) {
    return String(s).replace(/[&<>"']/g, function (c) {
      return { '&': '&amp;', '<': '&lt;', '>': '&gt;', '"': '&quot;', "'": '&#39;' }[c];
    });
  }

  // localStorage 在部分瀏覽器（無痕、內建瀏覽器）可能不能用，讀寫失敗就當作沒有，照樣可以玩
  function loadState() {
    try { return JSON.parse(localStorage.getItem(STORE_KEY) || 'null'); } catch (e) { return null; }
  }
  function saveState() {
    try { localStorage.setItem(STORE_KEY, JSON.stringify(state)); } catch (e) { /* 存不了就算了 */ }
  }

  function firstUnanswered() {
    for (let i = 0; i < state.questions.length; i++) {
      if (!state.results[i]) return i;
    }
    return -1;
  }

  function totalReward() {
    return state.results.reduce(function (sum, r) { return sum + (r && r.correct ? PRIZE : 0); }, 0);
  }

  // ===== 遊戲橫幅：音效/音樂（來自 橫幅.html，Web Audio API 合成，不需外部音樂檔） =====
  let audioCtx = null;
  let bgmInterval = null;
  let isSoundActive = false;
  let mutedByUser = false; // 使用者手動靜音時設true，聊天結束恢復播放時要尊重這個選擇

  function initAudioContext() {
    if (!audioCtx) {
      const AudioContext = window.AudioContext || window.webkitAudioContext;
      audioCtx = new AudioContext();
    }
    if (audioCtx.state === 'suspended') audioCtx.resume();
  }

  function playNote(freq, type, duration, startTime) {
    if (!audioCtx) return;
    startTime = startTime || 0;
    const osc = audioCtx.createOscillator();
    const gain = audioCtx.createGain();
    osc.type = type;
    osc.frequency.value = freq;
    gain.gain.setValueAtTime(0.08, audioCtx.currentTime + startTime);
    gain.gain.exponentialRampToValueAtTime(0.0001, audioCtx.currentTime + startTime + duration);
    osc.connect(gain);
    gain.connect(audioCtx.destination);
    osc.start(audioCtx.currentTime + startTime);
    osc.stop(audioCtx.currentTime + startTime + duration);
  }

  const melodyNotes = [261.63, 329.63, 392.00, 523.25, 392.00, 329.63];
  let noteIndex = 0;

  function startBGM() {
    if (bgmInterval) clearInterval(bgmInterval);
    bgmInterval = setInterval(function () {
      playNote(melodyNotes[noteIndex], 'triangle', 0.22);
      noteIndex = (noteIndex + 1) % melodyNotes.length;
    }, 280);
    isSoundActive = true;
    document.getElementById('musicBtn').innerText = '🎵';
  }

  function stopBGM() {
    if (bgmInterval) { clearInterval(bgmInterval); bgmInterval = null; }
    isSoundActive = false;
    document.getElementById('musicBtn').innerText = '🔇';
  }

  function toggleAudio() {
    initAudioContext();
    if (isSoundActive) { stopBGM(); mutedByUser = true; }
    else { startBGM(); mutedByUser = false; }
  }

  // 使用者第一次點「開始問答」時解鎖並播放（瀏覽器規定要有點擊才能出聲）
  function unlockAudio() {
    initAudioContext();
    if (!isSoundActive && !mutedByUser) startBGM();
  }

  function playEffectSound(type) {
    initAudioContext();
    if (type === 'correct') {
      playNote(523.25, 'sine', 0.15, 0);
      playNote(659.25, 'sine', 0.15, 0.12);
      playNote(783.99, 'sine', 0.35, 0.24);
    } else {
      playNote(220.00, 'sawtooth', 0.18, 0);
      playNote(196.00, 'sawtooth', 0.30, 0.15);
    }
  }

  // 結算用的簡單完成感叮聲，跟答對/BGM音色區隔開來
  function playEndingChime() {
    if (!audioCtx) return;
    playNote(523.25, 'sine', 0.2, 0);
    playNote(659.25, 'sine', 0.2, 0.15);
    playNote(783.99, 'sine', 0.2, 0.3);
    playNote(1046.50, 'sine', 0.6, 0.45);
  }

  function setBannerProgress(stepIndex) {
    const box = document.getElementById('charBox');
    const positions = { 1: '15%', 2: '45%', 3: '75%' };
    box.style.left = positions[stepIndex] || '15%';
  }

  function triggerFeedback(type) {
    const sprite = document.getElementById('charSprite');
    sprite.classList.remove('char-jump', 'char-shake');
    void sprite.offsetWidth;
    playEffectSound(type);
    sprite.classList.add(type === 'correct' ? 'char-jump' : 'char-shake');
    setTimeout(function () {
      sprite.classList.remove('char-jump', 'char-shake');
    }, 1300);
  }

  // ===== 進入：決定是新的一輪、接續、還是只看憑證 =====
  function init() {
    // 不論同期限制，答到一半一律接續（防刷新逃題）；同期限制只決定「答完後能不能再玩一輪」
    const saved = loadState();
    const hasSaved = saved && saved.activity === ACTIVITY && Array.isArray(saved.questions) && saved.questions.length;

    // 已截止／已額滿：本期已拿到憑證的人照樣顯示憑證，其他人直接告知，不讓他開始答題
    if (STATUS !== 'open') {
      if (hasSaved && saved.cert) {
        state = saved;
        showCertificate(true);
      } else if (STATUS === 'full') {
        showMessage('🈵 本期名額已額滿', '謝謝你的參與！請留意粉絲專頁的下一期活動。');
      } else {
        showMessage('⌛ 本期活動已截止', '謝謝你的支持！請留意粉絲專頁的下一期活動。');
      }
      return;
    }

    const finishedAndCanReplay = hasSaved && saved.cert && !CONFIG.samePeriodLimit;
    if (hasSaved && !finishedAndCanReplay) {
      state = saved;
    } else {
      state = {
        activity: ACTIVITY,
        questions: FRESH_QUESTIONS,
        results: FRESH_QUESTIONS.map(function () { return null; }),
        shown: -1,
        cert: null
      };
    }

    // 作答中途重新整理：回到同一題，倒數剩下的秒數（離開的時間也算在內）；時間已過就算超時。
    // 題目固定在 localStorage，刷新換不到別題，也拖不到時間
    let escapedIndex = -1;
    let resumeMidQuestion = false;
    if (state.shown >= 0 && !state.results[state.shown]) {
      const elapsed = state.shownAt ? Date.now() - state.shownAt : Infinity;
      if (elapsed < SECONDS * 1000) {
        resumeMidQuestion = true;
      } else {
        state.results[state.shown] = { chosen: '', correct: false, timeout: true };
        escapedIndex = state.shown;
        state.shown = -1;
      }
    } else {
      state.shown = -1;
    }
    saveState();

    if (!state.questions.length) {
      showMessage('😥 題目載入失敗', '請稍後重新整理頁面再試一次。');
      return;
    }
    if (state.cert) {
      showCertificate(true);
      return;
    }

    qIndex = firstUnanswered();
    if (qIndex === -1) {
      // 三題都答完了但憑證還沒發成功（例如上次送出時斷線），直接重新送出
      showSummary();
      return;
    }

    // 倒數還在跑，不停在開場畫面浪費秒數，直接回到題目
    if (resumeMidQuestion) {
      showQuizScreen();
      renderQuestion();
      const left = Math.ceil((SECONDS * 1000 - (Date.now() - state.shownAt)) / 1000);
      document.getElementById('feedback-area').innerHTML =
        '<div class="feedback feedback-timeout">⚡ 接續作答，本題剩 ' + left + ' 秒</div>';
      return;
    }

    document.getElementById('intro-rule').textContent =
      '共 ' + state.questions.length + ' 題，每題 ' + SECONDS + ' 秒，答對一題 ' + PRIZE + ' 元';
    if (qIndex > 0) {
      document.getElementById('intro-text').textContent = '接續作答：第 ' + (qIndex + 1) + ' 題／共 ' + state.questions.length + ' 題';
      document.getElementById('intro-rule').textContent =
        (escapedIndex >= 0 ? '第 ' + (escapedIndex + 1) + ' 題作答中離開，以超時計算。' : '') +
        '目前累計 ' + totalReward() + ' 元';
      document.getElementById('intro-btn').textContent = '繼續作答';
      setBannerProgress(qIndex + 1);
    }
    document.getElementById('screen-intro').style.display = 'block';
  }

  function showMessage(title, msg) {
    document.getElementById('screen-intro').style.display = 'none';
    document.getElementById('screen-quiz').style.display = 'none';
    const cert = document.getElementById('screen-cert');
    cert.innerHTML = '<div class="cert-title">' + escapeHtml(title) + '</div><div class="final-msg">' + escapeHtml(msg) + '</div>';
    cert.style.display = 'block';
  }

  function beginQuiz() {
    unlockAudio();
    document.getElementById('screen-intro').style.display = 'none';
    showQuizScreen();
    renderQuestion();
  }

  // 作答畫面隱藏上方標題列（首頁已看過「天生一對」），截止時間改顯示在題數上方，
  // 讓題目＋4 個選項不用捲動就看得到，避免捲動時誤按選項
  function showQuizScreen() {
    document.querySelector('.header').style.display = 'none';
    document.getElementById('screen-quiz').style.display = 'block';
  }

  function diffMark(difficulty) {
    // 測試觀察用：easy→H、normal→M、hard→L，不出現「等級」字樣
    if (difficulty === 'easy') return 'H';
    if (difficulty === 'hard') return 'L';
    return 'M';
  }

  function renderQuestion() {
    const q = state.questions[qIndex];
    // 第一次顯示這題才記出題時間；刷新接續時沿用原本的時間，倒數不會重來
    if (state.shown !== qIndex || !state.shownAt) {
      state.shown = qIndex;
      state.shownAt = Date.now();
      saveState();
    }
    const elapsed = Date.now() - state.shownAt;
    const remaining = Math.max(0, SECONDS * 1000 - elapsed);

    document.getElementById('progress').textContent = '第 ' + (qIndex + 1) + ' 題／共 ' + state.questions.length + ' 題';
    document.getElementById('diff-mark').textContent = diffMark(q.difficulty);
    setBannerProgress(qIndex + 1);
    document.getElementById('question-text').textContent = q.question;
    document.getElementById('feedback-area').innerHTML = '';

    document.getElementById('options').innerHTML = q.options.map(function (opt, i) {
      return '<button class="option-btn" data-idx="' + i + '" onclick="handleAnswer(' + i + ')">' +
        escapeHtml(opt) + '</button>';
    }).join('');

    // 重新啟動倒數條動畫（CSS animation重播的標準做法：移除再加回去，中間強制reflow）
    const timerFill = document.getElementById('timer-fill');
    timerFill.style.animation = 'none';
    timerFill.style.animationPlayState = ''; // 清掉上一題答完時凍結的狀態，這題才會正常跑
    void timerFill.offsetWidth;
    timerFill.style.animation = '';
    timerFill.style.animationDuration = SECONDS + 's';
    timerFill.style.animationDelay = -(elapsed / 1000) + 's'; // 負的延遲＝從已經過的進度開始跑

    clearTimeout(questionTimer);
    questionTimer = setTimeout(handleTimeout, remaining);
  }

  function optionLetter(opt) {
    // 選項格式如 "A.外星人"，取出開頭字母跟正解比對
    const m = String(opt).match(/^([A-Za-z])[.、]/);
    return m ? m[1].toUpperCase() : null;
  }

  function markCorrectOption(q) {
    document.querySelectorAll('.option-btn').forEach(function (b) {
      b.disabled = true;
      const letter = optionLetter(q.options[Number(b.dataset.idx)]);
      if (letter === String(q.answer).trim().toUpperCase()) b.classList.add('correct');
    });
  }

  function handleAnswer(idx) {
    clearTimeout(questionTimer);
    document.getElementById('timer-fill').style.animationPlayState = 'paused'; // 凍結在作答當下的位置

    const q = state.questions[qIndex];
    const chosenLetter = optionLetter(q.options[idx]);
    const correct = chosenLetter === String(q.answer).trim().toUpperCase();

    markCorrectOption(q);
    if (!correct) {
      const chosenBtn = document.querySelector('.option-btn[data-idx="' + idx + '"]');
      if (chosenBtn) chosenBtn.classList.add('wrong');
    }

    state.results[qIndex] = { chosen: chosenLetter || '', correct: correct, timeout: false };
    state.shown = -1;
    state.shownAt = null;
    saveState();

    currentQuestionText = q.question;
    currentFeedbackText = correct ? ('✅ 答對了！+' + PRIZE + '元') : ('❌ 答錯了，正解是 ' + q.answer);
    chatHistory = [];
    chatRound = 0;
    triggerFeedback(correct ? 'correct' : 'wrong');

    document.getElementById('feedback-area').innerHTML =
      '<div class="feedback ' + (correct ? 'feedback-ok' : 'feedback-bad') + '">' + escapeHtml(currentFeedbackText) + '</div>';

    setTimeout(function () { showChatPrompt(q.seed); }, 600);
  }

  // 超時：鎖選項、標出正解、記為答錯，跳過聊天，停留片刻後直接下一題
  function handleTimeout() {
    const q = state.questions[qIndex];
    markCorrectOption(q);

    state.results[qIndex] = { chosen: '', correct: false, timeout: true };
    state.shown = -1;
    state.shownAt = null;
    saveState();

    triggerFeedback('wrong');
    document.getElementById('feedback-area').innerHTML =
      '<div class="feedback feedback-timeout">⏰ 時間到！正解是 ' + escapeHtml(q.answer) + '</div>';

    setTimeout(nextStep, 1500);
  }

  function showChatPrompt(seed) {
    const box = document.createElement('div');
    box.id = 'chat-box';
    box.dataset.seed = seed || '這個話題';
    box.innerHTML = '<div class="chat-prompt">要聊聊「' + escapeHtml(seed || '這個話題') + '」嗎？</div>' +
      '<div class="chat-actions">' +
        '<button class="btn btn-skip" onclick="nextStep()">跳過</button>' +
        '<button class="btn btn-chat" onclick="startChat()">聊聊</button>' +
      '</div>';
    document.getElementById('feedback-area').appendChild(box);
  }

  function startChat() {
    document.getElementById('gameBanner').style.display = 'none';
    stopBGM();

    const box = document.getElementById('chat-box');
    box.innerHTML =
      '<div class="chat-log" id="chat-log"></div>' +
      '<div class="chat-input-row" id="chat-input-row">' +
        '<input type="text" id="chat-input" placeholder="輸入訊息…" onkeydown="if(event.key===\'Enter\')sendChatMessage()">' +
        '<button class="btn-send" id="chat-send-btn" onclick="sendChatMessage()">送出</button>' +
      '</div>' +
      '<button class="btn btn-next" id="chat-next-btn" onclick="nextStep()">' +
        (firstUnanswered() === -1 ? '看結果' : '下一題') + '</button>';
    // 「下一題」從一開始就可以按，隨時能中斷聊天，不用等滿三輪
  }

  function appendChatBubble(role, text) {
    const log = document.getElementById('chat-log');
    const bubble = document.createElement('div');
    bubble.className = 'chat-bubble ' + (role === 'user' ? 'user' : 'model');
    bubble.textContent = text;
    log.appendChild(bubble);
    log.scrollTop = log.scrollHeight;
  }

  // 等待 Gemini 回覆時的「思考中」動畫泡泡，避免客人以為當機
  function showTyping() {
    const log = document.getElementById('chat-log');
    const bubble = document.createElement('div');
    bubble.id = 'chat-typing';
    bubble.className = 'chat-bubble model typing';
    bubble.innerHTML = '<span class="typing-label">小助手思考中</span><span class="dot"></span><span class="dot"></span><span class="dot"></span>';
    log.appendChild(bubble);
    log.scrollTop = log.scrollHeight;
  }

  function hideTyping() {
    const el = document.getElementById('chat-typing');
    if (el) el.remove();
  }

  // Gemini 偶爾仍會回 Markdown，泡泡是純文字顯示，把星號、井號、條列符號清掉
  function cleanReply(text) {
    return String(text)
      .replace(/^\s*#+\s*/gm, '')
      .replace(/^\s*[-*]\s+/gm, '')
      .replace(/\*/g, '')
      .trim();
  }

  // 結束聊天：移除輸入框（不會再出現第4輪的機會），顯示結尾訊息，「下一題」本來就在畫面上
  function endChat(msg) {
    appendChatBubble('model', msg);
    const row = document.getElementById('chat-input-row');
    if (row) row.remove();
  }

  function sendChatMessage() {
    const input = document.getElementById('chat-input');
    const message = input.value.trim();
    if (!message) return;

    const seed = document.getElementById('chat-box').dataset.seed;
    input.value = '';
    input.disabled = true;
    document.getElementById('chat-send-btn').disabled = true;
    appendChatBubble('user', message);
    showTyping();

    gasRun()
      .withSuccessHandler(function (res) {
        if (!document.getElementById('chat-log')) return; // 已經按下一題離開了
        hideTyping();
        if (!res || !res.ok) {
          endChat('小助手有點忙，先跳過聊天，繼續答題拿獎金吧！');
          return;
        }
        const reply = cleanReply(res.reply);
        appendChatBubble('model', reply);
        chatHistory.push({ role: 'user', text: message });
        chatHistory.push({ role: 'model', text: reply });
        chatRound++;

        if (chatRound >= 3) {
          endChat('謝謝您跟我聊天，下次再聊！請點下方按鈕繼續');
        } else {
          input.disabled = false;
          document.getElementById('chat-send-btn').disabled = false;
          input.focus();
        }
      })
      .withFailureHandler(function () {
        if (!document.getElementById('chat-log')) return;
        hideTyping();
        endChat('小助手有點忙，先跳過聊天，繼續答題拿獎金吧！');
      })
      .chatReply(seed, currentQuestionText, currentFeedbackText, chatHistory, message, TEST_CODE);
  }

  function nextStep() {
    document.getElementById('gameBanner').style.display = 'block';
    if (!mutedByUser && !isSoundActive) startBGM();

    qIndex = firstUnanswered();
    if (qIndex === -1) {
      showSummary();
    } else {
      renderQuestion();
    }
  }

  // ===== 三題答完：送後端重算金額、取憑證號 =====
  function showSummary() {
    clearTimeout(questionTimer);
    stopBGM();
    document.getElementById('screen-intro').style.display = 'none';
    document.getElementById('screen-quiz').style.display = 'none';
    document.getElementById('screen-summary').style.display = 'block';
    document.getElementById('summary-num').textContent = totalReward();
    submitCertificate();
  }

  function submitCertificate() {
    const body = document.getElementById('summary-body');
    body.innerHTML = '<div class="final-msg">正在產生得獎憑證…</div>';

    const answers = state.questions.map(function (q, i) {
      const r = state.results[i] || {};
      return { question: q.question, chosen: r.chosen || '', answer: q.answer, category: q.category || '', difficulty: q.difficulty || '' };
    });

    gasRun()
      .withSuccessHandler(function (res) {
        if (res && res.ok) {
          state.cert = res;
          saveState();
          playEndingChime();
          showCertificate(false);
          return;
        }
        const msg = (res && res.msg) || '發生錯誤，請稍後再試';
        // 系統忙碌可以重送；截止、額滿重送也沒用
        const canRetry = res && res.reason === 'busy';
        body.innerHTML = '<div class="final-msg">' + escapeHtml(msg) + '</div>' +
          (canRetry ? '<button class="btn btn-next" onclick="submitCertificate()">再送一次</button>' : '');
      })
      .withFailureHandler(function () {
        body.innerHTML = '<div class="final-msg">網路好像不太穩，憑證還沒產生成功</div>' +
          '<button class="btn btn-next" onclick="submitCertificate()">再送一次</button>';
      })
      .issueCertificate(ACTIVITY, answers, TEST_CODE);
  }

  function showCertificate(isRevisit) {
    const c = state.cert;
    document.getElementById('screen-intro').style.display = 'none';
    document.getElementById('screen-quiz').style.display = 'none';
    document.getElementById('screen-summary').style.display = 'none';
    setBannerProgress(3);
    // 憑證畫面只留截圖要用的資訊：隱藏上方標題列與橫幅；音樂鈕在橫幅裡，看不到就停掉音樂
    document.querySelector('.header').style.display = 'none';
    document.getElementById('gameBanner').style.display = 'none';
    stopBGM();

    const el = document.getElementById('screen-cert');
    // 再次進來只看到憑證時，依實際原因提示（同期限制 FALSE 但額滿／截止時，不能說「已參加過」）
    const revisitText = STATUS === 'full' ? '本期名額已額滿，以下是你這期的憑證'
      : STATUS === 'closed' ? '本期活動已截止，以下是你這期的憑證'
      : '本期你已經參加過囉！';
    const note = isRevisit ? '<div class="cert-note">' + revisitText + '</div>' : '';

    if (!c.certNo) {
      // 一題都沒答對：不發憑證，不用私訊客服
      el.innerHTML = note +
        '<div class="cert-title">本輪答對 0 題</div>' +
        '<div class="final-msg">這次沒有拿到獎金，不用私訊客服喔！<br>請留意粉絲專頁，下期再來挑戰 💪</div>';
    } else {
      el.innerHTML = note +
        '<div class="cert-title">🎉 得獎憑證</div>' +
        // 領取期限、末三碼等注意事項改由客服收到截圖時告知；畫面只留「截圖＋傳送客服」一個動作
        // 傳送門直接開 Messenger 私訊粉絲專頁（系統參數「FB網址」留空就只顯示文字）
        '<div class="cert-alert"><span>📸 請立刻截圖結果傳送客服</span>' +
          (CONFIG.messengerUrl
            ? '<a class="portal-btn" href="' + escapeHtml(CONFIG.messengerUrl) + '" target="_blank" rel="noopener">傳送客服</a>'
            : '') +
        '</div>' +
        '<div class="cert-ticket">' +
          '<div class="cert-label">憑證號碼</div>' +
          '<div class="cert-no">' + escapeHtml(c.certNo) + '</div>' +
          '<div class="cert-label">獎金</div>' +
          '<div class="cert-amount">' + escapeHtml(c.amount) + ' 元</div>' +
          '<div class="cert-coins">🪙💰🪙</div>' +
          '<div class="cert-meta">答對 ' + escapeHtml(c.correctCount) + ' 題／共 ' + state.questions.length + ' 題</div>' +
        '</div>';
    }
    el.style.display = 'block';
  }

  // 只顯示訊息（維護中／尚未開始／連線失敗）：標題列與橫幅一起收起，和 GAS 版的訊息頁一樣乾淨
  function showOnlyMessage(title, msg) {
    document.querySelector('.header').style.display = 'none';
    document.getElementById('gameBanner').style.display = 'none';
    showMessage(title, msg);
  }

  function boot() {
    callGasApi('init', { testCode: TEST_CODE }).then(function (d) {
      document.getElementById('screen-loading').style.display = 'none';
      if (d.state === 'maintenance') {
        showOnlyMessage('🛠 系統維護中', '請稍後再來' + (d.eta ? '（預計恢復時間：' + d.eta + '）' : ''));
        return;
      }
      if (d.state === 'not_started') {
        showOnlyMessage('⏳ 活動尚未開始', '請留意粉絲專頁的活動貼文，開始後就能參加喔！');
        return;
      }
      ACTIVITY = d.activityCode;
      STATUS = d.status;
      CONFIG = d.config || {};
      FRESH_QUESTIONS = d.freshQuestions || [];
      SECONDS = Number(CONFIG.secondsPerQuestion) || 15;
      PRIZE = Number(CONFIG.prizePerQuestion) || 10;
      document.querySelectorAll('.deadline-text').forEach(function (el) { el.textContent = d.deadlineText; });
      init();
    }).catch(function () {
      document.getElementById('screen-loading').innerHTML =
        '<div class="final-msg">網路好像不太穩，暫時連不上 😢</div>' +
        '<button class="btn btn-next" onclick="location.reload()">重新整理</button>';
    });
  }

  boot();
</script>
</body>
